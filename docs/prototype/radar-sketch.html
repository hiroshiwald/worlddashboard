<title>Radar Three Views</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: three views from the sketch (Newsfeed, Entities, Quick hits) on one shared world. A popup is shared by all views. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#EAEDF3; --line:#D8DDE7;
  --fg:#111827; --muted:#5B6579;
  --accent:#2956E8; --accent-soft:#E3EAFE; --on-accent:#FFFFFF;
  --good:#1B7F53; --good-soft:#DDF2E7;
  --warn:#8F5A06; --warn-soft:#FBEBCB;
  --bad:#B6410F; --bad-soft:#FADFD2;
  --k-ports:#2F6FDB; --k-energy:#7A4CC2; --k-grid:#0E8A8A; --k-fin:#A8741A;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C111A; --surface:#141B27; --surface-2:#1B2434; --line:#2A3548;
    --fg:#E7ECF5; --muted:#9AA6BC;
    --accent:#8AA8FF; --accent-soft:#1C2A52; --on-accent:#0C111A;
    --good:#4FCB8E; --good-soft:#12301F;
    --warn:#E3B04B; --warn-soft:#3A2D10;
    --bad:#F08A5D; --bad-soft:#3B1D10;
    --k-ports:#6FA0F5; --k-energy:#B592F0; --k-grid:#4FC9C9; --k-fin:#E0B15A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C111A; --surface:#141B27; --surface-2:#1B2434; --line:#2A3548;
  --fg:#E7ECF5; --muted:#9AA6BC;
  --accent:#8AA8FF; --accent-soft:#1C2A52; --on-accent:#0C111A;
  --good:#4FCB8E; --good-soft:#12301F;
  --warn:#E3B04B; --warn-soft:#3A2D10;
  --bad:#F08A5D; --bad-soft:#3B1D10;
  --k-ports:#6FA0F5; --k-energy:#B592F0; --k-grid:#4FC9C9; --k-fin:#E0B15A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--font-body);font-size:11px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:600;font-size:16px}
.mockflag{font-family:var(--font-mono);font-size:11px;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:4px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--fg)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:18px 72px}

.read{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 32px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.read h2{font-size:24px}
.read p{font-size:13px;color:var(--muted);max-width:70ch}
.read b{color:var(--fg);font-weight:600}
.fresh{font-size:12px;color:var(--muted);margin:0 0 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.linklike{background:none;border:0;padding:0;text-align:left;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.k-ports{background:var(--k-ports)}.k-energy{background:var(--k-energy)}.k-grid{background:var(--k-grid)}.k-fin{background:var(--k-fin)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;margin-bottom:12px}
.evlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.evmeta{font-size:12px;color:var(--muted)}
.evmeta .lag{color:var(--warn)}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.livedot.off{background:var(--muted)}
.newpill{display:block;width:100%;border:0;background:var(--accent);color:var(--on-accent);padding:8px;font-weight:600}
.newtag{font-family:var(--font-mono);font-size:9px;background:var(--good-soft);color:var(--good);border-radius:3px;padding:0 4px;margin-left:4px}
.chk{color:var(--good);font-weight:700}

/* 1 newsfeed, laid out like the sketch: headline and box | source and url | entities found and status */
.feed{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fh,.frow{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1.3fr);gap:6px 20px;padding:12px 16px}
.fh{background:var(--surface-2);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.frow{border-top:1px solid var(--line);border-left:3px solid transparent}
.frow.rel{border-left-color:var(--accent)}
.hl{font-weight:600;font-size:15px;line-height:1.35}
.hl .linklike{text-align:left}
.box{margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted);display:grid;gap:2px}
.box b{color:var(--fg);font-weight:500}
.srcname{font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.url{font-family:var(--font-mono);font-size:11px;color:var(--muted);word-break:break-all;margin-top:2px}
.elist{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.elist li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:6px;align-items:center}
.idx{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.ename{background:none;border:0;padding:0;text-align:left;font-weight:500}
.ename:hover{color:var(--accent);text-decoration:underline}
.ename.cand{border-bottom:1px dashed var(--muted)}
.ename.dis{color:var(--muted);text-decoration:line-through}
.ectrack{font-size:11px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:99px;padding:0 8px}
.ectrack:hover{background:var(--accent);color:var(--on-accent)}

/* popup */
.pop{position:fixed;z-index:30;width:360px;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 12px 40px rgba(10,20,40,.22)}
.pop[hidden]{display:none}
.pop h3{font-size:19px;margin:6px 0 2px}
.pop .x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:18px;color:var(--muted)}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:3px 10px;font-size:13px;margin:10px 0}
.kv dt{color:var(--muted);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0}
.rel-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* 2 entities spreadsheet */
.split{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(300px,1fr);gap:16px;align-items:start}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:640px}
.sheet table{border-collapse:separate;border-spacing:0;width:100%}
.sheet th,.sheet td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
.sheet th:last-child,.sheet td:last-child{border-right:0}
.sheet thead th{position:sticky;top:0;background:var(--surface-2);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;z-index:1}
.sheet th.rn,.sheet td.rn{width:34px;text-align:right;color:var(--muted);font-family:var(--font-mono);font-size:11px;background:var(--surface-2);cursor:default}
.sheet tbody tr{cursor:pointer}
.sheet tbody tr:hover td{background:var(--accent-soft)}
.sheet tbody tr[aria-selected="true"] td{background:var(--accent-soft);box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}
.sheet td.rn{background:var(--surface-2)!important}
.sheet .more{color:var(--muted)}
.sheet td:nth-child(3){white-space:nowrap}
.sheet thead th.act{color:var(--accent)}
.sheet thead th.ns{cursor:default}
.sheet table{min-width:780px;table-layout:fixed}
.sheet td{vertical-align:top;overflow-wrap:anywhere}
.split.map{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mapbox svg{width:100%;height:auto;display:block}
select.btn{padding:6px 10px}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:22px;vertical-align:middle}
.spark i{display:inline-block;width:4px;background:var(--line);border-radius:1px}
.spark i.hot{background:var(--accent)}
.rise{color:var(--accent);font-size:11px;font-weight:700}
.crumbs{font-size:14px}
.band{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em}
.halo{fill:none;stroke:var(--accent);stroke-width:2.5}
.ne{stroke:var(--muted);fill:none;stroke-opacity:.45}
.ne.new{stroke:var(--accent);stroke-opacity:.7}
.ne.hl{stroke:var(--accent);stroke-opacity:1;stroke-width:4px!important}
.gn.dim,.tb.dim{opacity:.2}
.gn text{pointer-events:none}
[data-drag]{cursor:grab;touch-action:none}
[data-drag]:active{cursor:grabbing}
#netsvg{user-select:none;-webkit-user-select:none}
.gn.pick circle.b{stroke-width:4px}
.gn:hover circle.b{stroke-width:4px}
.trace{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;margin-top:6px}
.trace select{min-width:0;width:100%}
.path{margin-top:10px;line-height:1.9}
.gn text.hot{fill:var(--accent);font-weight:600}
.mapbox .gn text.lbl{font-size:12.5px}
.ent .ln{opacity:0;pointer-events:none;transition:opacity .12s}
.ent .ln line{stroke:var(--accent);fill:none}
.ent:hover .ln{opacity:.85}
.x2{border:0;background:none;color:var(--muted);padding:0 0 0 4px;font-size:13px}
.panel .rel-row{align-items:center;gap:8px}
.panel .rel-row .chips{flex-wrap:nowrap;gap:6px;justify-content:flex-end}
.sheet.wide table{min-width:980px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
.panel svg{width:100%;height:auto;display:block}
.gn circle.b{stroke-width:2.5}
.gn.tracked circle.b{fill:var(--surface)}
.gn.cand circle.b{fill:var(--bg);stroke-dasharray:4 3}
.gn.anchor circle.b{fill:var(--fg);stroke:var(--fg)}
.gn text{fill:var(--fg);font-size:11px}
.gn.cand text{fill:var(--muted)}
.gn.focus circle.ring,.gn circle.ring{fill:none;stroke:var(--accent);stroke-width:2.5}
.ge{stroke:var(--line);fill:none}
.ge.new{stroke:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:220px}

/* 3 quick hits */
.hits{max-width:860px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 14px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rank{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:3px}
.sent{font-size:16px;line-height:1.45}
.sent b{font-weight:600}
.nextto{font-size:12px;color:var(--muted);margin-top:4px}
.act{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.row.done{opacity:.55}
.row .proof{grid-column:2/-1}
.cap{margin-top:14px;font-size:13px;color:var(--muted)}
.cap a{color:var(--accent);font-weight:500}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;font-weight:600;padding:0}

@media (max-width:860px){
  .read,.split,.split.map{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
  .fh{display:none}
  .frow{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:24px minmax(0,1fr)}
  .row .act{grid-column:2;justify-content:flex-start}
}
@media (max-width:640px){
  .pop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:70vh;border-radius:14px 14px 0 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <span class="brand">Radar, three views</span>
  <span class="mockflag">MOCK DATA · fictional names</span>
  <nav id="nav" aria-label="Views">
    <a href="#newsfeed">Newsfeed</a>
    <a href="#entities">Entities</a>
    <a href="#emap">Entity map</a>
    <a href="#quick">Quick hits</a>
  </nav>
</div></header>

<main class="wrap">
  <p id="fresh" class="fresh"></p>
  <section id="v-newsfeed"></section>
  <section id="v-entities" hidden></section>
  <section id="v-emap" hidden></section>
  <section id="v-quick" hidden></section>
</main>
<div id="pop" class="pop" role="dialog" aria-label="Entity" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";

  /* ================= helpers ================= */
  const NOW0 = Date.parse("2026-11-16T18:00:00Z");
  const HR = 3600000;
  const T0 = Date.now();
  const clock = () => NOW0 + (Date.now() - T0);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function agoMs(d) {
    const s = Math.max(0, Math.round(d / 1000));
    if (s < 60) return s + "s ago";
    const m = Math.round(s / 60);
    if (m < 60) return m + "m ago";
    const h = Math.round(m / 60);
    if (h < 48) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }
  const whenMs = (ms) => new Date(ms).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) + " UTC";
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  const andList = (a) => (a.length > 1 ? a.slice(0, -1).join(", ") + " and " + a[a.length - 1] : a[0] || "");
  const link = (t) => '<button type="button" class="linklike" data-mock="1">' + esc(t) + "</button>";
  const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 46);
  function urlOf(a) {
    const d = new Date(a.pub);
    return "https://" + a.s.toLowerCase().replace(/[^a-z0-9]+/g, "") + ".example/" + d.getUTCFullYear() + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") + "/" + slug(a.t);
  }
  function timeHtml(arr, pub) {
    let s = "Arrived " + agoMs(clock() - arr);
    if (arr - pub >= 6 * HR) s += ' · <span class="lag">published ' + agoMs(clock() - pub) + "</span>";
    return s;
  }
  const timeSpan = (a) => '<span data-arr="' + a.arr + '" data-pub="' + a.pub + '">' + timeHtml(a.arr, a.pub) + "</span>";
  const evHtml = (a) => "<li><div>" + link(a.t) + '</div><div class="evmeta">' + esc(a.s) + " · " + esc(a.c) + " · " + timeSpan(a) + "</div></li>";

  /* ================= mock world (fictional) ================= */
  const CL = { ports: "Ports & trade", energy: "Energy & nuclear", grid: "Grid & standards", fin: "Finance & rates" };
  const DEFS = [
    ["Kaldoria", "country", "ports", "tracked", true, 3],
    ["Orsund Federation", "country", "energy", "tracked", true, 2],
    ["Helix Grid Authority", "organization", "grid", "tracked", true, 1.5],
    ["Meridian Bank", "organization", "fin", "tracked", true, 1.5],
    ["Port of Tessen", "facility", "ports", "tracked", false, 0.2],
    ["Brannock Cable Co.", "organization", "grid", "tracked", false, 0.3],
    ["Norvik-7 reactor", "facility", "energy", "tracked", false, 0.2],
    ["Lysa Orvane", "person", "fin", "tracked", false, 0.3],
    ["Veyra Harbour Board", "organization", "ports", "tracked", false, 1],
    ["Sable Strait Pilots Guild", "organization", "ports", "candidate", false, 0],
    ["Dunmere Protocol", "other", "grid", "candidate", false, 0],
    ["Harlow Institute", "organization", "fin", "candidate", false, 0],
    ["Tarn Capital", "organization", "fin", "candidate", false, 0],
    ["Ashlen Ferry Co.", "organization", "ports", "candidate", false, 0],
    ["Quillan Freight", "organization", "ports", "candidate", false, 0],
    ["Teller Grain Co-op", "organization", "ports", "candidate", false, 0],
    ["Marl Island Terminal", "facility", "ports", "candidate", false, 0],
    ["Kaldoria Customs Authority", "organization", "ports", "candidate", false, 0],
    ["Orsund Nuclear Board", "organization", "energy", "candidate", false, 0],
    ["Ulwen Metering Ltd", "organization", "grid", "candidate", false, 0],
    ["Corvane Substation", "facility", "grid", "candidate", false, 0],
    ["Sable Strait cable", "facility", "grid", "candidate", false, 0],
    ["Orsund Fed.", "organization", "energy", "candidate", false, 0, { dupOf: "Orsund Federation" }],
    ["Q3 results", "other", "fin", "candidate", false, 0, { flag: "generic" }]
  ];
  const PENDING = { "Veyra Dock Workers Union": ["organization", "ports"], "Orrin Spec": ["other", "grid"] };
  const RAW = [
    ["Pilots serve strike notice at Kaldoria ports", "Trade Ledger", "Trade", 10, 9, ["Sable Strait Pilots Guild", "Kaldoria"]],
    ["Strait pilots threaten walkout over night shifts", "Kaldoria Gazette", "Mainstream", 7, 6, ["Sable Strait Pilots Guild", "Kaldoria", "Port of Tessen"]],

        '<div><p class="srcname">' + esc(a.s) + '</p><p class="url">' + esc(urlOf(a)) + '</p><p class="evmeta" style="margin-top:4px">' + esc(a.c) + " · " + timeSpan(a) + "</p></div>" +
        '<div><ol class="elist" style="list-style:none">' + ents.map((n, i) => '<li><span class="idx">' + (i + 1) + "</span>" + nameBtn(n, S.ents[n].status === "candidate" ? "cand" : S.ents[n].status === "dismissed" ? "dis" : "") + riseMark(n) + statusCell(n) + "</li>").join("") + "</ol></div></article>";

    const ctl = '<div class="chips"><span class="chip"><span class="livedot' + (UI.live ? "" : " off") + '"></span>' + (UI.live ? "Live" : "Paused") + '</span><button type="button" class="btn sm" data-live="1">' + (UI.live ? "Pause" : "Resume") + '</button><button type="button" class="btn sm" data-act="next" title="Prototype aid">Next mock article (' + S.queue.length + ")</button></div>";

  }
  const rank = (n) => { const e = S.ents[n]; return e.status === "tracked" && !e.anchor ? 0 : e.status === "candidate" ? 1 : e.status === "tracked" ? 2 : 3; };

  /* ================= 2 entities ================= */
  /* ================= entity facts: growth, diversity, topics ================= */
  function seeded(name) {
    let h = 2166136261;
    for (let i = 0; i < name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h += 0x6D2B79F5; let t = Math.imul(h ^ (h >>> 15), 1 | h); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function topicCounts(arts) {
    const c = {};
    arts.forEach((a) => { c[a.topic] = (c[a.topic] || 0) + 1; });
    return Object.keys(c).sort((x, y) => c[y] - c[x] || x.localeCompare(y)).map((t) => ({ t, n: c[t] }));
  }
  const primaryTopic = (n) => { const tc = topicCounts(artsOf(n)); return tc.length ? tc[0].t : "Other"; };
  // Growth: articles per day in the last 3 days against the entity's own usual rate. One metric, three states worth showing.
  function growth(n) {
    const e = S.ents[n], arts = artsOf(n), fs = firstSeen(n);
    const n72 = arts.filter((a) => clock() - a.arr < 72 * HR).length, older = arts.length - n72;
    const base = e.base > 0 ? e.base : Math.max(older / 11, 0.15);
    const ratio = (n72 / 3) / Math.max(base, 0.3);
    let state = "Steady";
    if (!e.anchor && e.status !== "tracked" && fs !== null && clock() - fs < 72 * HR) state = "New";
    else if (n72 >= 3 && ratio >= 3) state = "Rising";
    else if (e.base >= 0.5 && ratio < 0.5) state = "Falling";
    const score = state === "Rising" ? 100 + ratio : state === "New" ? 50 + n72 : state === "Falling" ? -1 : ratio;
    const r = seeded(n), hist = [];
    const day = (d) => arts.filter((a) => { const age = clock() - a.arr; return age >= d * 24 * HR && age < (d + 1) * 24 * HR; }).length;
    for (let d = 13; d >= 0; d--) hist.push(d >= 3 && e.base > 0 ? Math.max(0, Math.round(e.base + (r() - 0.5) * 2 * Math.sqrt(e.base + 0.3))) : day(d));
    return { state, ratio, n72, score, hist };
  }
  const ratioText = (g) => (g.ratio >= 10 ? "10+" : g.ratio.toFixed(1));
  const gChip = (g) => g.state === "Rising" ? '<span class="chip accent">▲ ×' + ratioText(g) + "</span>" : g.state === "New" ? '<span class="chip good">New</span>' : g.state === "Falling" ? '<span class="chip warn">▼ Falling</span>' : '<span class="chip">Steady</span>';

  function connCell(r) {

      '<div class="bar"><div class="chips"><input id="q" type="search" placeholder="Filter by name" value="' + esc(UI.q) + '" aria-label="Filter by name"><div class="seg" role="group" aria-label="Status">' +
      [["all", "All"], ["tracked", "Tracked"], ["untracked", "Not tracked"], ["dismissed", "Dismissed"]].map((x) => '<button type="button" data-st="' + x[0] + '" aria-pressed="' + (UI.status === x[0]) + '">' + x[1] + "</button>").join("") + '</div></div><span class="muted small">' + plural(rows.length, "entity", "entities") + " · sorted by <b>" + SORT_INFO[UI.sort.key][0] + "</b>. " + esc(SORT_INFO[UI.sort.key][1]) + "</span></div>" +
      '<div class="sheet wide"><table><colgroup><col style="width:3%"><col style="width:14%"><col style="width:9%"><col style="width:13%"><col style="width:7%"><col style="width:16%"><col style="width:21%"><col style="width:17%"></colgroup><thead><tr><th class="rn">#</th>' + th("Entity", "name") + th("Status", "tracked") + th("Growth", "growth") + th("Mentions", "mentions") + th("Source", "diversity") + '<th class="ns">Connection to what you track</th><th class="ns">Topics</th></tr></thead><tbody>' + (body || '<tr><td colspan="8" class="muted">No entities match.</td></tr>') + "</tbody></table></div>" +

  }

  /* ================= 3 quick hits ================= */
  function drawQuick(el) {

      const it = buildItem(n);
      if (!it) return '<li class="row done"><span class="rank">' + (i + 1) + '</span><div class="sent muted">' + esc(n) + " is now " + esc(S.ents[n] ? (S.ents[n].status === "tracked" ? "tracked" : S.ents[n].status) : "gone") + ", decided in another view.</div><span></span></li>";
      return '<li class="row"><span class="rank">' + (i + 1) + '</span><div><p class="sent">' + it.html + '</p><div class="nextto">Next to ' + it.nextTo.map((x) => '<i class="dot k-' + S.ents[x].cluster + '"></i>' + esc(x)).join(" · ") + " · first seen " + agoMs(clock() - firstSeen(n)) + '</div><div class="chips" style="margin-top:6px">' + stateChip(n) + '<button type="button" class="linklike small" data-act="proofq" data-name="' + esc(n) + '">' + (UI.open[n] ? "Hide proof" : "Proof · " + plural(it.total, "article", "articles")) + "</button></div></div>" +
        '<div class="act"><button type="button" class="btn primary" data-act="decide" data-a="' + primary(it)[0] + '" data-name="' + esc(n) + '">' + primary(it)[1] + '</button><button type="button" class="btn" data-act="decide" data-a="' + secondary(it)[0] + '" data-name="' + esc(n) + '">' + secondary(it)[1] + "</button></div>" + (UI.open[n] ? '<div class="proof"><ul class="evlist">' + it.proof.map(evHtml).join("") + "</ul></div>" : "") + "</li>";

  /* ================= 4 entity map: universe, cluster, entity ================= */

      "<title>" + esc(n) + " · " + esc(e.type) + (hot ? " · rising fast" : "") + "</title>" + (o.act ? '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 8) + '" style="fill:transparent;stroke:none"/>' : "") + (hot ? '<circle class="halo" cx="' + x + '" cy="' + y + '" r="' + (r + 5) + '"/>' : "") +

  const hoverLines = (n, pos) => nbrsOf(n).filter((x) => pos[x.n] && visible(x.n)).map((x) => '<line x1="' + pos[n].x + '" y1="' + pos[n].y + '" x2="' + pos[x.n].x + '" y2="' + pos[x.n].y + '" style="stroke-width:' + (1.5 + Math.min(x.e.n, 4) * 0.8) + '"/>').join("");

  const clusterMembers = (ts) => Object.keys(S.ents).filter((n) => visible(n) && !S.ents[n].anchor && ts.indexOf(primaryTopic(n)) > -1).sort((a, b) => growth(b).score - growth(a).score);

  }
  function clusterPanel(ts, mem) {

      out += '<g data-drag="h:' + esc(t) + '" style="cursor:grab">' + pts.map((q) => '<circle data-act="nettopic" data-t="' + esc(t) + '" cx="' + q.x + '" cy="' + q.y + '" r="40" style="fill:color-mix(in srgb,' + col + " " + (on ? 26 : 15) + '%,transparent);stroke:none"/>').join("") +
        '<text data-act="netexp" data-t="' + esc(t) + '" x="' + cx + '" y="' + ly + '" text-anchor="middle" style="fill:var(--fg);font-weight:600;font-size:12px;cursor:pointer;paint-order:stroke;stroke:var(--surface);stroke-width:4px">− ' + esc(t) + " · " + lay.byTopic[t].length + (rising ? " ▲" + rising : "") + "</text></g>";
    });
    lay.edges.forEach((e) => {
      const a = p[e.ka], b = p[e.kb], onPath = pathPairs.has(e.ka + "||" + e.kb), on = edgeOn(e), selE = sel && sel.type === "e" && sel.ka === e.ka && sel.kb === e.kb;
      out += '<g data-act="netedge" data-ka="' + esc(e.ka) + '" data-kb="' + esc(e.kb) + '" style="cursor:pointer"><line class="gh" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/><line class="ne' + (clock() - e.first < 48 * HR ? " new" : "") + (onPath || selE ? " hl" : "") + '" style="stroke-width:' + (1 + Math.min(e.w, 8) * 0.45) + ";opacity:" + ((path.length && !onPath) || !on ? 0.1 : 1) + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/></g>';
    });
    const labelItems = [], extra = [];
    lay.units.forEach((u) => {
      const q = p[u.key];
      if (u.kind === "t") extra.push({ x: q.x - u.r, y: q.y - u.r, w: 2 * u.r, h: 2 * u.r + 16 });
      else labelItems.push({ name: u.name, x: q.x, y: q.y, r: u.r });
    });
    hulls.forEach((h) => extra.push({ x: h.cx - 70, y: h.ly - 12, w: 140, h: 14 }));
    const place = placeLabels(labelItems, extra);
    const drawn = lay.units.filter((u) => u.kind === "t").concat(lay.units.filter((u) => u.kind !== "t"));
    drawn.forEach((u) => {
      const q = p[u.key], dim = dimUnit(u.key);
      if (u.kind === "t") {
        const col = topicColor(u.t), rising = u.mem.filter((n) => growth(n).state === "Rising").length, isSel = sel && sel.type === "t" && sel.t === u.t;
        out += '<g class="tb' + (dim ? " dim" : "") + '" data-act="netexp" data-t="' + esc(u.t) + '" data-drag="' + esc(u.key) + '" style="cursor:pointer"><title>' + esc(u.t) + " · select to open</title>" + (rising ? '<circle class="halo" cx="' + q.x + '" cy="' + q.y + '" r="' + (u.r + 5) + '"/>' : "") +
          '<circle cx="' + q.x + '" cy="' + q.y + '" r="' + u.r + '" style="fill:color-mix(in srgb,' + col + ' 18%,var(--surface));stroke:' + col + ";stroke-width:" + (isSel ? 3.5 : 2) + '"/><text x="' + q.x + '" y="' + (q.y + 5) + '" text-anchor="middle" style="fill:var(--fg);font-weight:700;font-size:15px">' + u.mem.length + "</text>" +
          '<text x="' + q.x + '" y="' + (q.y + u.r + 15) + '" text-anchor="middle" style="fill:var(--fg);font-weight:600;font-size:12px">' + esc(u.t) + (rising ? " ▲" + rising : "") + "</text></g>";
      } else {
        const selN = sel && sel.type === "n" && sel.n === u.name;
        out += nodeSvg(u.name, q.x, q.y, { act: "netsel", drag: u.key, r: u.r, max: 20, cls: (dim ? "dim " : "") + (selN || pathSet.has(u.key) ? "pick" : ""), stroke: S.ents[u.name].anchor ? null : topicColor(primaryTopic(u.name)), lab: place[u.name] });
      }
    });
    return out;
  }
  function networkSvg() {
    const M = UI.emap, lay = netLayout(M, effExpanded(M));
    return '<svg id="netsvg" viewBox="0 0 1000 ' + lay.H + '" role="group" aria-label="Network of all entities, grouped by topic">' + netInner() + "</svg>";
  }
  function networkPanel() {
    const M = UI.emap, ex = effExpanded(M), lay = netLayout(M, ex), nm = netModel(M.anchors), other = netModel(!M.anchors), sel = M.sel;
    const opts = (cur) => '<option value="">Choose…</option>' + Object.keys(S.ents).filter(visible).sort().map((x) => '<option value="' + esc(x) + '"' + (x === cur ? " selected" : "") + ">" + esc(x) + "</option>").join("");
    const li = (n) => '<div class="rel-row"><span><button type="button" class="ename' + (S.ents[n].status === "candidate" ? " cand" : "") + '" data-act="entmap" data-name="' + esc(n) + '">' + esc(n) + '</button></span><span class="chips">' + gChip(growth(n)) + spark(growth(n)) + statusCell(n) + "</span></div>";
    let selHtml = "";
    if (sel && sel.type === "t") {
      const mem = lay.byTopic[sel.t] || [], open = ex.has(sel.t), arts = S.arts.filter((a) => a.topic === sel.t);
      selHtml = '<p class="eyebrow" style="margin-top:14px">Cluster</p><h3 style="font-size:18px;margin:4px 0">' + esc(sel.t) + '</h3><p class="muted small">' + plural(mem.length, "entity", "entities") + " · " + plural(arts.length, "article", "articles") + " · " + mem.filter((n) => growth(n).state === "Rising").length + ' rising</p><div class="actions"><button type="button" class="btn sm" data-act="netexp" data-t="' + esc(sel.t) + '">' + (open ? "Collapse" : "Open in place") + '</button><button type="button" class="btn sm" data-act="cluster" data-t="' + esc(sel.t) + '">Open cluster page</button></div><div style="margin-top:8px">' + mem.map(li).join("") + "</div>";
    } else if (sel && sel.type === "n" && visible(sel.n)) {
      const n = sel.n;
      selHtml = '<p class="eyebrow" style="margin-top:14px">Selected</p><div class="chips" style="margin-top:6px">' + stateChip(n) + gChip(growth(n)) + '</div><h3 style="font-size:18px;margin:6px 0">' + esc(n) + '</h3><p class="muted small">' + plural(nbrsOf(n).filter((x) => visible(x.n)).length, "link", "links") + " · " + plural(facts(n).count, "article", "articles") + '</p><div class="actions">' + actionBtns(n) + '<button type="button" class="btn sm" data-act="entmap" data-name="' + esc(n) + '">Open map</button><button type="button" class="btn sm" data-act="tracefrom" data-name="' + esc(n) + '">Trace from here</button><button type="button" class="btn sm" data-act="traceto" data-name="' + esc(n) + '">Trace to here</button></div>';
    } else if (sel && sel.type === "e") {
      const e = lay.edges.filter((x) => x.ka === sel.ka && x.kb === sel.kb)[0];
      if (e) {
        const arts = []; e.links.forEach((l) => l.arts.forEach((a) => { if (arts.indexOf(a) < 0) arts.push(a); }));
        selHtml = '<p class="eyebrow" style="margin-top:14px">Selected link</p><h3 style="font-size:16px;margin:6px 0">' + esc(unitLabel(sel.ka)) + " ↔ " + esc(unitLabel(sel.kb)) + '</h3><p class="muted small">' + plural(e.links.length, "entity link", "entity links") + " · " + plural(arts.length, "article", "articles") + "</p>" +
          e.links.slice().sort((x, y) => y.n - x.n).slice(0, 5).map((l) => '<div class="rel-row"><span>' + esc(l.a) + " ↔ " + esc(l.b) + '</span><span class="evmeta">' + plural(l.n, "article", "articles") + "</span></div>").join("") + '<ul class="evlist">' + arts.sort((x, y) => y.arr - x.arr).slice(0, 3).map(evHtml).join("") + "</ul>";
      }
    }
    const fast = Object.keys(S.ents).filter(visible).map((n) => ({ n, g: growth(n) })).filter((r) => r.g.state === "Rising" || r.g.state === "New").sort((a, b) => b.g.score - a.g.score).slice(0, 5);
    const growthHtml = selHtml ? "" : '<p class="eyebrow" style="margin-top:14px">Growing fastest</p>' + (fast.length ? fast.map((r) => li(r.n)).join("") : '<p class="muted small">Nothing is growing fast right now.</p>');
    const path = shortestPath(M.from, M.to, M.anchors);
    let trace = "";
    if (M.from && M.to && M.from !== M.to) {
      if (path) {
        trace = '<div class="path">' + path.map((n, i) => (i ? '<span class="muted"> → </span>' : "") + '<button type="button" class="ename" data-act="entmap" data-name="' + esc(n) + '">' + esc(n) + "</button>").join("") + '</div><p class="muted small">' + plural(path.length - 1, "hop", "hops") + "</p>" +
          path.slice(1).map((n, i) => { const e = derive().edges.get([path[i], n].sort().join("|")), a = e.arts.slice().sort((x, y) => y.arr - x.arr)[0]; return '<div style="margin-top:8px"><b>' + esc(path[i]) + " ↔ " + esc(n) + '</b> <span class="evmeta">' + plural(e.n, "article", "articles") + '</span><ul class="evlist" style="margin-top:4px">' + evHtml(a) + "</ul></div>"; }).join("");
      } else {
        const alt = shortestPath(M.from, M.to, true);
        trace = '<p class="muted small" style="margin-top:6px">' + (!M.anchors && alt ? "Not connected without context entities. Through them: " + alt.map(esc).join(" → ") + "." : "These two never appear together, directly or through other entities.") + "</p>";
      }
    }
    return '<div class="panel"><p class="eyebrow">Universe</p><p style="margin-top:6px"><b class="num">' + nm.names.length + "</b> entities · <b class=\"num\">" + nm.edges.length + "</b> links · <b class=\"num\">" + nm.islands + "</b> " + (nm.islands === 1 ? "island" : "islands") + ", <b class=\"num\">" + nm.isolated + "</b> not connected</p>" +
      '<p class="muted small" style="margin-top:4px">' + (M.anchors ? "Without context entities: " : "With context entities: ") + other.islands + (other.islands === 1 ? " island, " : " islands, ") + other.isolated + " not connected.</p>" + selHtml + growthHtml +
      '<p class="eyebrow" style="margin-top:14px">Trace a connection</p><div class="trace"><select id="tfrom" class="btn" aria-label="From">' + opts(M.from) + '</select><span class="muted">to</span><select id="tto" class="btn" aria-label="To">' + opts(M.to) + "</select></div>" + trace + "</div>";
  }

  /* ----- the map screen ----- */
  function drawEmap(el) {
    const M = UI.emap;
    if (M.focus && !visible(M.focus)) M.focus = null;
    const level = M.focus ? "entity" : M.topics.length ? "cluster" : "universe";
    const crumbs = [];
    crumbs.push(level === "universe" ? "<b>Universe</b>" : '<button type="button" class="linklike" data-act="uni">Universe</button>');
    if (M.topics.length) crumbs.push(level === "cluster" ? "<b>" + esc(M.topics.join(" + ")) + "</b>" : '<button type="button" class="linklike" data-act="clusterback">' + esc(M.topics.join(" + ")) + "</button>");
    if (M.focus) crumbs.push("<b>" + esc(M.focus) + "</b>");
    const opts = '<option value="">Jump to an entity…</option>' + Object.keys(S.ents).filter(visible).sort().map((x) => '<option value="' + esc(x) + '">' + esc(x) + (S.ents[x].status === "candidate" ? " (not tracked)" : "") + "</option>").join("");
    let body, hint;
    if (level === "universe") { body = '<div class="mapbox">' + networkSvg() + "</div>" + networkPanel(); hint = "Start with the clusters. Select a cluster to open it. Drag anything to see around it. Select an entity or a link for details."; }
    else if (level === "cluster") { const mem = clusterMembers(M.topics); body = '<div class="mapbox">' + clusterSvg(M.topics, mem) + "</div>" + clusterPanel(M.topics, mem); hint = "Entities that appear mostly in this topic, and how they link. Select an entity to explore it."; }
    else { const model = mapModel(M.focus); body = '<div class="mapbox">' + (nbrsOf(M.focus).filter((x) => visible(x.n)).length ? entitySvg(M.focus, model) : '<p class="muted" style="padding:20px">No linked entities yet.</p>') + "</div>" + entityPanel(M.focus, model); hint = "One entity and the topics it appears in. Select a topic for its cluster. Select a linked entity to move to it."; }
    const tools = level === "universe" ? '<div class="seg" role="group" aria-label="Context entities"><button type="button" data-act="netanch" data-v="1" aria-pressed="' + M.anchors + '">With context</button><button type="button" data-act="netanch" data-v="0" aria-pressed="' + !M.anchors + '">Without context</button></div>' +
      '<button type="button" class="btn sm" data-act="expandall">Open all</button><button type="button" class="btn sm" data-act="collapseall">Close all</button><button type="button" class="btn sm" data-act="resetlayout">Reset layout</button>' : "";
    el.innerHTML = '<div class="read"><h2>Entity map</h2><p>' + esc(hint) + '</p></div><div class="bar"><div class="crumbs">' + crumbs.join(" › ") + '</div><div class="chips">' + tools + '<select id="emapjump" class="btn" aria-label="Jump to an entity">' + opts + '</select><a href="#entities" class="linklike">Entities list</a></div></div>' +
      '<div class="split map">' + body + '</div><div class="legend" style="margin-top:8px">' + (level === "universe" ? "<span>Numbered circle: a cluster. Select to open it</span>" : "") + '<span>Solid ring: tracked</span><span>Dashed: not tracked</span><span>Black: context (anchor)</span><span><b style="color:var(--accent)">Blue halo ▲ ×N</b>: growing at N times its usual rate</span><span>NEW: first seen in the last 3 days</span>' + (level === "universe" ? "<span>Line weight = articles together · <b style=\"color:var(--accent)\">blue line</b> = together in the last 2 days</span>" : "") + "</div>";
  }

  function setMap(patch) { UI.emap = Object.assign({}, UI.emap, patch, { sel: null }); }

  /* ================= wiring ================= */
  const DRAW = { newsfeed: drawNewsfeed, entities: drawEntities, emap: drawEmap, quick: drawQuick };
  let view = "newsfeed";
  function emit() {
    DRAW[view](document.getElementById("v-" + view));
    drawPop();
    const arr = S.arts.reduce((m, a) => Math.max(m, a.arr), 0);
    document.getElementById("fresh").innerHTML = "Data as of " + whenMs(arr) + ". Last article arrived <span data-since=\"" + arr + '">' + agoMs(clock() - arr) + "</span>. " + plural(S.arts.length, "article", "articles") + ", " + plural(Object.keys(S.ents).length, "entity", "entities") + ". Next scheduled ingest 06:13 UTC. <a href=\"#\" data-act=\"restart\" style=\"color:var(--accent)\">Restart demo</a>";
  }
  function refresh() {
    const r = ranked();
    const keep = deck.filter((n) => !answered.has(n));
    deck = keep.concat(r.map((x) => x.name).filter((n) => keep.indexOf(n) < 0).slice(0, Math.max(0, 10 - keep.length)));
    seenIds = new Set(r.map((x) => x.name));
    emit();
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-mock]")) { showToast("Mock link. In the app this opens the source article.", false); return; }
    const pop = document.getElementById("pop");
    const b = e.target.closest("[data-act]");
    if (!b && !e.target.closest("#pop") && !pop.hidden) { UI.pop = null; drawPop(); }
    const f = e.target.closest("[data-f]"), st = e.target.closest("[data-st]"), so = e.target.closest("[data-sort]");
    if (f) { UI.filter = f.dataset.f; emit(); return; }
    if (st) { UI.status = st.dataset.st; UI.sel = null; emit(); return; }
    if (so) { const key = so.dataset.sort; UI.sort = { key, dir: UI.sort.key === key ? -UI.sort.dir : 1 }; emit(); return; }
    if (e.target.closest("[data-live]")) { UI.live = !UI.live; UI.freezeAt = UI.live ? null : clock(); emit(); return; }
    if (e.target.closest("[data-show]")) { UI.freezeAt = UI.live ? null : clock(); emit(); return; }
    if (!b) return;
    const a = b.dataset.act, n = b.dataset.name;
    if (a === "pop") { e.preventDefault(); openPop(b, !!b.dataset.inpop); }
    else if (a === "popclose") { UI.pop = null; drawPop(); }
    else if (a === "decide") decide(n, b.dataset.a);
    else if (a === "undo") undo();
    else if (a === "next") nextArticle();
    else if (a === "sel") { UI.sel = n; if (view !== "entities") { location.hash = "entities"; } else emit(); }
    else if (a === "openent") { UI.sel = n; UI.q = ""; UI.status = "all"; UI.pop = null; location.hash = "entities"; if (view === "entities") emit(); }
    else if (a === "proofq") { UI.open[n] = !UI.open[n]; emit(); }
    else if (a === "refresh") refresh();
    else if (a === "uni") { setMap({ topics: [], focus: null }); emit(); }
    else if (a === "cluster") { const t = b.dataset.t, cur = UI.emap.topics; setMap({ topics: b.dataset.add ? (cur.indexOf(t) < 0 ? cur.concat([t]) : cur) : [t], focus: null }); UI.pop = null; if (view !== "emap") location.hash = "emap"; else emit(); }
    else if (a === "netanch") { UI.emap.anchors = b.dataset.v === "1"; UI.emap.sel = null; emit(); }
    else if (a === "netexp") { const t = b.dataset.t, cur = UI.emap.expanded, open = cur.indexOf(t) > -1; UI.emap.expanded = open ? cur.filter((x) => x !== t) : cur.concat([t]); UI.emap.sel = open ? null : { type: "t", t }; emit(); }
    else if (a === "nettopic") { UI.emap.sel = { type: "t", t: b.dataset.t }; emit(); }
    else if (a === "netsel") { UI.emap.sel = { type: "n", n }; emit(); }
    else if (a === "netedge") { UI.emap.sel = { type: "e", ka: b.dataset.ka, kb: b.dataset.kb }; emit(); }
    else if (a === "expandall") { UI.emap.expanded = [...new Set(Object.keys(S.ents).filter((x) => visible(x) && !S.ents[x].anchor).map(primaryTopic))]; UI.emap.sel = null; emit(); }
    else if (a === "collapseall") { UI.emap.expanded = []; UI.emap.sel = null; emit(); }
    else if (a === "resetlayout") { UI.emap.off = {}; emit(); }
    else if (a === "trace") { setMap({ topics: [], focus: null, from: n, to: b.dataset.to, anchors: true }); UI.pop = null; if (view !== "emap") location.hash = "emap"; else emit(); }
    else if (a === "tracefrom") { UI.emap.from = n; emit(); }
    else if (a === "traceto") { UI.emap.to = n; emit(); }
    else if (a === "clusterrm") { UI.emap.topics = UI.emap.topics.filter((t) => t !== b.dataset.t); emit(); }
    else if (a === "clusterback") { UI.emap.focus = null; emit(); }
    else if (a === "entmap" || a === "openmap") { setMap({ topics: view === "emap" ? UI.emap.topics : [], focus: n }); UI.pop = null; if (view !== "emap") location.hash = "emap"; else emit(); }
    else if (a === "restart") { e.preventDefault(); init(); emit(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "tfrom") { UI.emap.from = e.target.value; emit(); return; }
    if (e.target.id === "tto") { UI.emap.to = e.target.value; emit(); return; }
    if (e.target.id === "emapjump" && e.target.value) { setMap({ topics: [], focus: e.target.value }); emit(); }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "q") { UI.q = e.target.value; emit(); } });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (UI.pop) { UI.pop = null; drawPop(); return; }
      if (view === "emap") { if (UI.emap.focus) UI.emap.focus = null; else UI.emap.topics = []; emit(); }
      return;
    }
    if (view !== "entities" || (e.target && e.target.id === "q") || e.metaKey || e.ctrlKey || e.altKey) return;
    const names = [...document.querySelectorAll("#v-entities tbody tr[data-name]")].map((r) => r.dataset.name);
    if (!names.length) return;
    if (e.key === "Enter" && UI.sel) { setMap({ topics: [], focus: UI.sel }); location.hash = "emap"; return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    UI.sel = names[Math.max(0, Math.min(names.length - 1, names.indexOf(UI.sel) + (e.key === "ArrowDown" ? 1 : -1)))];
    emit();
    const row = document.querySelector('#v-entities tr[aria-selected="true"]');
    if (row) row.scrollIntoView({ block: "nearest" });
  });
  window.addEventListener("scroll", () => { if (UI.pop && window.innerWidth > 640 && window.scrollY !== UI.pop.sy) { UI.pop = null; drawPop(); } }, { passive: true });
  // Drag any node, topic bubble or opened-topic outline. The svg keeps the pointer, so redrawing its contents does not drop the drag.
  let drag = null;
  document.addEventListener("pointerdown", (e) => {
    const g = view === "emap" ? e.target.closest("[data-drag]") : null;
    if (!g || !g.ownerSVGElement || g.ownerSVGElement.id !== "netsvg") return;
    const key = g.dataset.drag, o = UI.emap.off[key] || { dx: 0, dy: 0 };
    drag = { key, svg: g.ownerSVGElement, id: e.pointerId, sx: e.clientX, sy: e.clientY, o0: { dx: o.dx, dy: o.dy }, moved: false };
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) { drag.moved = true; try { drag.svg.setPointerCapture(drag.id); } catch (err) { /* capture is optional */ } }
    const scale = drag.svg.getScreenCTM().a || 1;
    UI.emap.off[drag.key] = { dx: drag.o0.dx + dx / scale, dy: drag.o0.dy + dy / scale };
    const svg = document.getElementById("netsvg");
    if (svg) svg.innerHTML = netInner();
  });
  const endDrag = () => { drag = null; };
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  function route() {
    const id = location.hash.slice(1);
    view = DRAW[id] ? id : "newsfeed";
    Object.keys(DRAW).forEach((k) => { document.getElementById("v-" + k).hidden = k !== view; });
    document.querySelectorAll("#nav a").forEach((a) => { if (a.getAttribute("href") === "#" + view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    UI.pop = null; emit();
  }
  window.addEventListener("hashchange", route);
  setInterval(() => {
    document.querySelectorAll("[data-arr]").forEach((s) => { s.innerHTML = timeHtml(Number(s.dataset.arr), Number(s.dataset.pub)); });
    document.querySelectorAll("[data-since]").forEach((s) => { s.textContent = agoMs(clock() - Number(s.dataset.since)); });
  }, 10000);
  init();
  route();
})();
</script>
